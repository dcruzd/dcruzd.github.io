          title: Daniel Cruz Doggenweiler
          subtitle: "I'm a researcher at the Center for Civil Society Research, Berlin Social Science Center (WZB). Previously, I was a Posdoctoral Fellow at the University of Copenhagen and an affiliated researcher at King's College London. My research focuses mostly on political psychology and behavior, with my PhD having a special interest in political elites. I use primarily survey experiments and different causal identification strategies in my research. I hold a PhD and a MSc in Political Science from the University of Copenhagen, a Master's degree in Social Science Research from the Humboldt Universität zu Berlin, and a BA in Political Science from the Pontificia Universidad Católica de Chile."
          imageUrl: "picture.jpeg"
